<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Tangub City Global College</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h1>Tangub City Global College</h1>
      <p class="motto">"Una ang Ginoo" Light of the World</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="Enter your email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="Enter your password">
        </div>

        <button type="submit" class="btn">Login</button>
      </form>

      <p id="errorMsg" class="error-msg"></p>

      <p class="verse">
        "You are the light of the world. A town built on a hill cannot be hidden."<br>
        — Matthew 5:14
      </p>
    </div>
  </div>

  <script>
    // You can change these credentials anytime
    const VALID_EMAIL = "jaylo@antoque.com";
    const VALID_PASSWORD = "12345";

    const form = document.getElementById("loginForm");
    const errorMsg = document.getElementById("errorMsg");

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      const enteredEmail = document.getElementById("email").value.trim();
      const enteredPass = document.getElementById("password").value;

      if (enteredEmail === VALID_EMAIL && enteredPass === VALID_PASSWORD) {
        window.location.href = "home.html";
      } else {
        errorMsg.textContent = "❌ Invalid email or password. Please try again.";
        errorMsg.style.display = "block";
      }
    });
  </script>
</body>
</html>
